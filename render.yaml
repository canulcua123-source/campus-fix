# Blueprint de Render: API FastAPI en Docker (plan gratuito). Deploy automático al hacer push/merge a main.
# Los valores con sync: false se capturan en el panel de Render; nunca se escriben aquí.
services:
  - type: web
    name: utm-desk-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: utm_desk
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DOMINIO_CORREO
        value: utm.edu.mx
      # La PWA llama a la API por el proxy same-origin de Cloudflare Pages (/api/* → esta API), así la
      # cookie de refresh es de primera parte: basta Lax + Secure (None la bloquean Safari/iOS/PWA).
      # El proxy reescribe Path=/auth → /api/auth. CORS_ORIGINS debe incluir el dominio de Pages.
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: IA_HABILITADA
        value: "true"
      # Gemini con llave gratuita (AI Studio). En la capa gratuita Google puede usar las fotos:
      # la PWA lo avisa al usuario. El cupo diario global se ajusta en Configuración (admin).
      - key: IA_PROVEEDOR
        value: gemini
      - key: GEMINI_CAPA
        value: gratuita
      - key: GEMINI_MODELO
        value: gemini-3.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IA_PERMITIR_CAPA_GRATUITA
        value: "true"
