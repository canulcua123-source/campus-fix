# Seguridad en cada PR: detección de secretos (gitleaks) y reglas de base de datos.
name: seguridad

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Instalar gitleaks (binario fijado + checksum)
        # Se usa el binario y no gitleaks-action para no requerir licencia en cuentas de organización.
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "$base/$archivo"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archivo\$" checksums.txt | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Buscar secretos en los commits del PR
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! gitleaks git --config .github/gitleaks.toml --log-opts="origin/$BASE..HEAD" --redact --verbose --no-banner; then
            echo "::error::gitleaks encontró posibles secretos. NO basta con borrarlos en un commit nuevo: rota la credencial (cámbiala en el servicio) y reescribe tu rama (git rebase -i origin/$BASE) para quitarla del historial."
            exit 1
          fi

  reglas-bd:
    name: reglas-bd
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Revisar patrones peligrosos de BD en el diff
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/github/revisar_reglas_bd.py --base "origin/$BASE"
