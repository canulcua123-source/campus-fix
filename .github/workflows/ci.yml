# CI principal: pruebas, lint y build. El job `ci-ok` es el ÚNICO que se marca como
# "required status check" (los demás pueden saltarse por filtros de rutas).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lee la lista de archivos del PR

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detectar-cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      postman: ${{ steps.filtro.outputs.postman }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            postman:
              - 'postman/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s
    # Valores FICTICIOS solo para CI. El conftest e2e además fuerza localhost y la BD `utm_desk_test`.
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_ADMIN_URI: ""
      MONGODB_DB: utm_desk_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-valor-ficticio-no-es-un-secreto-real-0000000000
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff==0.17.1
      - name: Ruff (lint)
        run: ruff check . --output-format=github
      - name: Pytest (unitarias + e2e contra Mongo/Redis de servicio)
        run: pytest tests -q

  frontend:
    name: frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (tsc -b + vite build)
        run: npm run build

  postman:
    name: postman (JSON válido)
    needs: changes
    if: needs.changes.outputs.postman == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar postman/*.json
        run: |
          estado=0
          for f in postman/*.json; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "OK  $f"
            else
              echo "::error file=$f::JSON inválido en $f"
              estado=1
            fi
          done
          exit $estado

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, frontend, postman]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resumen
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: echo "$RESULTADOS"
      - name: Falla si algún job falló o se canceló (skipped = OK)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o se canceló. Revisa los jobs anteriores."
          exit 1
