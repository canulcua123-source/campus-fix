name: Bug
description: Algo no funciona como debería.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No pegues contraseñas, tokens, URIs de Atlas ni datos personales reales."
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Backend / API, Base de datos, Frontend / UX, CI / GitHub, Otra]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: Incluye código de estado HTTP, mensaje de error o captura.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: "Local (Docker) / producción, navegador, rama o commit."
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Crítica (bloquea o expone datos), Alta, Media, Baja]
    validations:
      required: true
