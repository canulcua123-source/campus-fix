# Hooks locales. Instalar una vez:  pip install pre-commit && pre-commit install
# Correr en todo el repo:           pre-commit run --all-files
# Nota: ruff-format reformatea los .py que toques; el primer PR de formato masivo debe ser
# un `chore(backend): ruff format` aislado (sin cambios de lógica).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig admite comentarios (JSONC)
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1 # misma versión que CI (ci.yml)
    hooks:
      # Sin --config: ruff descubre backend/ruff.toml solo (con --config las rutas de
      # per-file-ignores se resolverían desde la raíz y dejarían de aplicar).
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # misma versión que CI (seguridad.yml)
    hooks:
      - id: gitleaks
        args: [--config=.github/gitleaks.toml]
