<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
    <script>
      // T-058: aplica el tema guardado antes del primer pintado (sin parpadeo). Espejo de src/lib/tema.ts.
      try {
        var tema = localStorage.getItem('utm-desk:tema')
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light'
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          var color = document.querySelector('meta[name="theme-color"][media*="' + (tema === 'oscuro' ? 'dark' : 'light') + '"]').content
          metas.forEach(function (m) { m.dataset.original = m.content; m.content = color })
        }
      } catch (e) {
        // Sin almacenamiento (modo privado): se queda el tema del sistema.
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UTM Desk" />
    <meta name="description" content="UTM Desk: reporte y seguimiento de incidencias del campus" />
    <title>UTM Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
